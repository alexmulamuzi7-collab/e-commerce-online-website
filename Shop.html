<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Laptops, Computers & Electronics | TechStore Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container nav-wrapper">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fas fa-microchip"></i></div>
                <div class="logo-text">TECH<span>STORE</span></div>
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html" class="active">Categories & Shop</a>
                <a href="contact.html">Contact Us</a>
            </nav>
            <div class="nav-actions">
                <button class="nav-btn" id="cartToggle"><i class="fas fa-shopping-bag"></i> Cart (<span id="cartCount">0</span>)</button>
            </div>
        </div>
    </header>

    <!-- Main Store Layout -->
    <main class="container section">
        <div class="section-title">
            <h2>Product Catalog</h2>
            <p>Select a category or search for specific computer hardware and electronics</p>
        </div>

        <div class="store-layout">
            <!-- Sidebar Filtering -->
            <aside class="sidebar">
                <h3>Filter By Category</h3>
                <div class="filter-options">
                    <button class="filter-btn active" data-category="all">All Products</button>
                    <button class="filter-btn" data-category="laptops">Laptops</button>
                    <button class="filter-btn" data-category="computers">Computers & Rigs</button>
                    <button class="filter-btn" data-category="electronics">Electronics & Audio</button>
                </div>
            </aside>

            <!-- Product Grid -->
            <div class="products-grid" id="productGrid">
                <!-- Dynamically populated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Shopping Cart Drawer Overlay -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3>Your Shopping Cart</h3>
            <button id="closeCart" class="close-btn">&times;</button>
        </div>
        <div class="drawer-body" id="cartItems">
            <p>Your cart is empty.</p>
        </div>
        <div class="drawer-footer">
            <div class="total-row">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="alert('Order placed successfully!')">Checkout Now</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 TechStore Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
